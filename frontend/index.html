<!DOCTYPE html>
<html>
<head>
  <title>CivicAI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>🗳 CivicAI</h2>
    <button onclick="getSteps()">📋 Steps</button>
    <button onclick="getTimeline()">📅 Timeline</button>
  </div>

  <!-- Chat Area -->
  <div class="chat-container">
    <div id="chat" class="chat-box"></div>

    <div class="input-area">
      <input id="userInput" placeholder="Ask about elections..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
